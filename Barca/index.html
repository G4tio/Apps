<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#080b16">
<meta name="description" content="Barça Pulse: último resultado, próximo partido con cuenta regresiva, goleadores, estadísticas y clasificaciones del FC Barcelona en LaLiga y Champions League.">
<meta property="og:title" content="Barça Pulse · FC Barcelona">
<meta property="og:description" content="Resultados, calendario, estadísticas y clasificaciones del FC Barcelona en tiempo real.">
<meta property="og:type" content="website">
<title>Barça Pulse · FC Barcelona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
/* ===== Barça Pulse · estilos consolidados ===== */
:root{
 --bg:#080b16;--panel:#111626;--cream:#f6f4f5;--claret:#a50044;--blue:#004d98;
 --pink:#f04c80;--sky:#4d8ee8;--line:#2a3654;--muted:#a7adbd;--ok:#20c997;--bad:#ff5268;
 --f-head:'Oswald',system-ui,sans-serif;--f-body:'Barlow Condensed',system-ui,sans-serif;--f-mono:'Space Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
 margin:0;min-height:100vh;color:var(--cream);font:18px/1.35 var(--f-body);
 background:
  linear-gradient(135deg,transparent 0 17%,#004d9818 17.1% 19%,transparent 19.1% 74%,#a5004417 74.1% 76%,transparent 76.1%),
  radial-gradient(ellipse at 4% 2%,#a5004438 0,transparent 28%),
  radial-gradient(ellipse at 100% 35%,#004d9838 0,transparent 33%),var(--bg);
}
body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:-1;width:190px;height:430px;opacity:.55;transform:skewY(-35deg);
 background:repeating-linear-gradient(135deg,transparent 0 17px,#004d9840 18px 27px,transparent 28px 44px)}
body:before{left:-125px;top:18vh}
body:after{right:-135px;bottom:3vh;background:repeating-linear-gradient(135deg,transparent 0 17px,#a5004445 18px 27px,transparent 28px 44px)}
img{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:2px}
[hidden]{display:none!important}
.skip-link{position:absolute;left:-999px;top:8px;background:#fff;color:#000;padding:8px 12px;z-index:2000;font-family:var(--f-mono);font-size:12px}
.skip-link:focus{left:8px}
.app{width:min(100%,1120px);margin:auto;padding:24px clamp(16px,5vw,58px) 48px;position:relative}

/* Cabecera */
header{display:flex;align-items:center;min-height:122px;padding:18px 0 25px;border-bottom:1px solid #ffffff18;margin-bottom:24px;position:relative}
header:after{content:"";position:absolute;bottom:-2px;left:0;width:110px;height:4px;background:linear-gradient(90deg,var(--claret),var(--blue))}
.brand{display:flex;align-items:center;gap:15px;min-width:0}
.brand img{width:66px;height:74px;object-fit:contain;filter:drop-shadow(0 8px 12px #0008)}
.brandname{font:700 clamp(23px,4.2vw,42px)/1 var(--f-head);letter-spacing:2px;text-transform:uppercase}
.brand-tagline{font:clamp(8px,1.4vw,11px) var(--f-mono);letter-spacing:1.5px;color:#aebbd3;margin-top:3px}
.barca-hero-banner{width:100%;aspect-ratio:1536/270;max-height:230px;overflow:hidden;background:#061126;border:1px solid #429dff4d;border-radius:12px;margin:0 0 18px}
.barca-hero-banner img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 42%}

/* Tarjetas */
.card{
 position:relative;overflow:hidden;margin:22px 0 30px;padding:clamp(20px,3.5vw,36px);
 border:1px solid var(--line);border-radius:2px;background:linear-gradient(145deg,#111626f5,#0d1120f8);
 box-shadow:0 22px 45px #0005,inset 4px 0 0 var(--claret);
}
.card:before{content:"";position:absolute;top:0;right:0;width:90px;height:6px;background:linear-gradient(90deg,var(--claret),var(--blue))}
.cardhead{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;margin-bottom:26px;text-align:center}
h2{margin:0;width:100%;font:600 clamp(27px,4.2vw,48px)/.98 var(--f-head);letter-spacing:1px;text-transform:uppercase}
.index{font:12px var(--f-mono);letter-spacing:1.2px;color:#b7c5e4}
.card-btn{border:1px solid #3989f5;background:#101c31;color:#a9d5ff;border-radius:999px;padding:8px 14px;font:600 11px var(--f-body);letter-spacing:.08em;cursor:pointer;transition:background .2s}
.card-btn:hover{background:#17294a}
.live-badge{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;background:#a5004433;border:1px solid var(--pink);font:700 12px var(--f-mono);letter-spacing:1px;color:#ffd6e4}
.live-badge i{width:9px;height:9px;border-radius:50%;background:var(--pink);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.last-result-clickable{cursor:pointer;transition:border-color .2s}
.last-result-clickable:hover{border-color:#3989f5}

/* Marcador */
.scoreline{display:grid;grid-template-columns:1fr 1.45fr 1fr;align-items:center;text-align:center;gap:12px}
.team{display:flex;flex-direction:column;align-items:center;min-width:0}
.team img{width:clamp(58px,12vw,110px);height:clamp(58px,12vw,110px);object-fit:contain;filter:drop-shadow(0 8px 12px #0006)}
.teamname{margin-top:8px;font:600 clamp(17px,4vw,30px)/1.1 var(--f-head);text-transform:uppercase;letter-spacing:.5px;overflow-wrap:anywhere}
.score{display:flex;justify-content:center;align-items:center;gap:12px;font:600 clamp(50px,12vw,110px)/1 var(--f-head);letter-spacing:-2px;font-variant-numeric:tabular-nums}
.score .home{color:var(--pink)}.score .away{color:var(--sky)}.score .dash{color:var(--cream);font-size:.5em}
.matchmeta{display:flex;justify-content:space-between;gap:16px;margin-top:14px;color:#f04c80;font-size:clamp(15px,3vw,22px)}
.goal-scorers{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:17px;padding-top:14px;border-top:1px solid #293653}
.goal-team{min-width:0}
.goal-team-title{font:12px var(--f-mono);color:var(--sky);letter-spacing:1.2px;margin-bottom:7px;overflow-wrap:anywhere}
.goal-team ul{list-style:none;margin:0;padding:0;font-size:19px;line-height:1.35}
.goal-team li{margin:2px 0}
.goal-team li span{margin-left:6px;color:var(--pink);font:14px var(--f-mono)}
.goal-team li em{margin-left:5px;color:var(--muted);font:normal 12px var(--f-mono)}
.goal-empty{color:#999;font-size:15px}
.form-strip{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}
.form-label{font:11px var(--f-mono);letter-spacing:1.2px;color:#b9c8e6;margin-right:6px}
.form-chip{width:34px;height:34px;display:grid;place-items:center;border-radius:6px;font:600 16px var(--f-head);color:#fff;cursor:help}
.form-chip.w{background:#16875f}.form-chip.d{background:#6b7280}.form-chip.l{background:#b4233f}
.form-chip:last-child{outline:2px solid #ffffff66;outline-offset:2px}

/* Video */
.video{padding:0;background:#0b1020}
.video-frame{position:relative;aspect-ratio:16/9;background:#050711}
.video-frame iframe,.video-facade{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-facade{padding:0;background:#000;cursor:pointer;overflow:hidden}
.video-facade img{width:100%;height:100%;object-fit:cover;opacity:.85;transition:opacity .25s,transform .35s}
.video-facade:hover img{opacity:1;transform:scale(1.02)}
.video-facade:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#080b16 0%,transparent 40%)}
.video-play{position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;display:grid;place-items:center;padding-left:6px;border-radius:50%;background:#a50044e8;border:2px solid #fff;font:32px Arial,sans-serif;color:#fff;box-shadow:0 5px 25px #0008}
.videocaption{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 24px;font:500 clamp(15px,2.7vw,22px) var(--f-head);text-transform:uppercase;letter-spacing:.8px}
.videocaption a{font:12px var(--f-mono);color:var(--pink);text-decoration:none;white-space:nowrap}

/* Próximo partido */
.nextinfo{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.kickoff{font:600 clamp(23px,5vw,42px)/1.1 var(--f-head);color:var(--sky);white-space:nowrap}
.kickoff span{color:var(--cream)}
.nextcomp{color:#999;margin-top:5px;font-size:15px}
.fixtureteams{display:flex;gap:14px;align-items:center}
.fixtureteams img{width:clamp(44px,8vw,64px);height:clamp(44px,8vw,64px);object-fit:contain}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px;text-align:center;color:#aaa;font-size:clamp(16px,3vw,24px)}
.day{padding:8px 3px;line-height:1.45}
.day strong{display:block;color:var(--cream);font-weight:500;font-size:1.12em}
.day.active{background:#a5004430;color:#ff4c82;box-shadow:inset 0 -3px #ed1c5b}
.day.active strong{color:#ff4c82}
.match-countdown{margin-top:20px;padding:17px 14px;border:1px solid #344a75;background:linear-gradient(120deg,#0f2d5cb3,#640e2f73)}
.countdown-title{font:11px var(--f-mono);letter-spacing:1.2px;color:#b9c8e6;margin-bottom:12px}
.countdown-units{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.countdown-unit{text-align:center;padding:12px 5px 9px;background:#050a168c;border:1px solid #96afdc33}
.countdown-value{font:700 clamp(24px,5vw,38px)/1 var(--f-head);font-variant-numeric:tabular-nums}
.countdown-label{font:9px var(--f-mono);color:#aebbd3;letter-spacing:.7px;margin-top:7px}
.countdown-status{font:10px/1.5 var(--f-mono);color:#b9c8e6;text-align:center;margin-top:11px}

/* Goleadores y estadísticas */
.player-scorers,.stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.player-scorer,.stat-tile{border:1px solid #293653;background:linear-gradient(135deg,#151b2d,#0b1020);min-width:0}
.player-scorer{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:11px;padding:13px 10px}
.scorer-rank{font:13px var(--f-mono);color:#8eb8f0}
.scorer-name{font:clamp(16px,2.3vw,22px)/1.05 var(--f-head);overflow-wrap:anywhere}
.scorer-meta{font:9px var(--f-mono);color:#9aa6c0;margin-top:5px;letter-spacing:.4px}
.scorer-goals{font:700 clamp(23px,3vw,31px) var(--f-head);color:var(--pink);text-align:center}
.scorer-goals small{display:block;font:9px var(--f-mono);color:#9aa6c0}
.stat-tile{padding:16px 13px}
.stat-label{font:10px/1.4 var(--f-mono);letter-spacing:.6px;color:#9aa6c0;text-transform:uppercase}
.stat-number{font:400 clamp(26px,4vw,39px)/1.05 var(--f-head);margin-top:8px;font-variant-numeric:tabular-nums}
.stat-number.accent{color:var(--pink)}.stat-number.blue{color:var(--sky)}
.module-note{font:10px/1.5 var(--f-mono);color:#8996b0;margin-top:14px}

/* Clasificaciones */
.league-card .cardhead{margin-bottom:6px}
.league-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px 0 12px;font:500 20px var(--f-head);color:#ff4c82;text-transform:uppercase}
.league-summary .points{font:700 clamp(20px,4vw,30px) var(--f-mono);color:var(--sky);white-space:nowrap}
.league-scroll{max-height:320px;overflow:auto;border-top:1px solid #283653;scrollbar-width:thin;scrollbar-color:var(--claret) #101626;overscroll-behavior:contain}
.league-table{width:100%;min-width:410px;border-collapse:collapse;font-size:18px}
.league-table th{position:sticky;top:0;z-index:1;padding:9px 8px;background:var(--panel);color:#8eb8f0;font:400 13px var(--f-mono);text-align:right;border-bottom:1px solid #31486f}
.league-table td{padding:8px;text-align:right;white-space:nowrap;color:#d7dce8;border-bottom:1px solid #202b42;font-variant-numeric:tabular-nums}
.league-table th:nth-child(2),.league-table td:nth-child(2){text-align:left}
.league-table .pos{text-align:center;color:#aaa}
.league-table .club{display:flex;align-items:center;gap:8px;min-width:155px}
.league-table .club img{width:24px;height:24px;object-fit:contain}
.league-table tbody tr:last-child td{border-bottom:0}
.league-table tr.barca-row{background:#a5004426}
.league-table tr.barca-row td{color:#ff4c82;font-weight:700}
.league-table td[colspan]{text-align:center;color:#aaa;padding:18px}

/* Estado */
.status{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-top:24px;padding:18px 20px;font:11px/1.7 var(--f-mono);color:#9aa6c0;background:linear-gradient(120deg,#111827,#0b0e19 72%);border:1px solid #29344d;border-left:4px solid var(--claret);border-radius:12px;box-shadow:0 12px 30px #0003}
.status-copy{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.status-label{display:flex;align-items:center;gap:8px;color:#f4dce7;font:13px var(--f-head);letter-spacing:1.2px;text-transform:uppercase}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px #20c99788}
.status.error .status-dot{background:var(--bad);box-shadow:0 0 10px #ff526888}
.status.error .status-detail{color:#ffb6a6}
.status button{min-width:180px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 20px;background:linear-gradient(135deg,#b0004a,#850039);border:1px solid #ed2b73;border-radius:7px;font:17px var(--f-head);letter-spacing:1.4px;text-transform:uppercase;color:#fff;cursor:pointer;transition:transform .2s,filter .2s}
.status button:hover{transform:translateY(-2px);filter:brightness(1.12)}
.status button:disabled{opacity:.65;cursor:wait;transform:none}

/* Pie */
.official-footer{margin-top:28px;padding:25px 12px 18px;text-align:center;border-top:1px solid #653821;background:linear-gradient(135deg,#120b11,#0c101b)}
.footer-heading{font:700 clamp(21px,4vw,29px) var(--f-head);letter-spacing:3px;color:#f7e5dc}
.official-site{display:inline-block;margin:14px 0 17px;padding:10px 16px;border:1px solid #e62f40;border-radius:3px;color:#fff;text-decoration:none;font:12px var(--f-mono);letter-spacing:.6px}
.official-site:hover{background:#e62f4022}
.official-socials{display:flex;justify-content:center;flex-wrap:wrap;gap:9px 20px}
.official-socials a{font:12px var(--f-mono);color:#d7c6c1;text-decoration:none}
.official-socials a:hover{color:#ff8737}
.footer-note{margin-top:20px;font:9px var(--f-mono);letter-spacing:1.5px;color:#88818a}

/* Modal de detalle */
.match-detail-backdrop{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:14px;background:#02060fd1}
.match-detail-backdrop.open{display:flex}
.match-detail-dialog{width:min(900px,100%);max-height:92vh;overflow:auto;background:#101722;border:1px solid #30425d;border-radius:18px;box-shadow:0 24px 90px #000b}
.match-detail-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;background:#101722;border-bottom:1px solid #28384d}
.match-detail-head h2{font-size:clamp(18px,3vw,26px);width:auto;text-align:left}
.match-detail-close{width:38px;height:38px;border:0;border-radius:50%;background:#273449;font-size:23px;cursor:pointer}
.match-detail-score{display:flex;align-items:center;justify-content:space-around;gap:10px;padding:18px;text-align:center;background:linear-gradient(110deg,#35102a,#0e1b31 55%,#102e54)}
.match-detail-club{display:flex;align-items:center;gap:10px;font-weight:700}
.match-detail-club img{width:42px;height:42px;object-fit:contain}
.match-detail-scoreline{font:800 clamp(26px,5vw,40px) var(--f-head);white-space:nowrap}
.match-detail-tabs{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px 0}
.match-detail-tabs button{padding:9px 14px;border:1px solid #30425d;border-radius:999px;background:#172334;color:#cbd5e1;cursor:pointer}
.match-detail-tabs button.active{background:#9d0649;border-color:#d81b60;color:#fff}
.match-detail-panel{padding:18px}
.match-detail-note{margin:16px 0 0;font:12px/1.5 var(--f-mono);color:#9aa9bc}
.match-detail-empty{padding:24px 8px;text-align:center;color:#b7c4d7}
.match-stat-row{display:grid;grid-template-columns:48px minmax(70px,1fr) minmax(100px,1.3fr) minmax(70px,1fr) 48px;align-items:center;gap:10px;margin:15px 0}
.match-stat-value{text-align:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.match-stat-label{text-align:center;color:#c6cfdd;font-size:15px}
.match-stat-bar{height:7px;display:flex;background:#243247;border-radius:9px;overflow:hidden}
.match-stat-bar.home{justify-content:flex-end}
.match-stat-bar span{display:block;height:100%;background:#bf0750}
.match-stat-bar.away span{background:#2678d5}
.match-lineup-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.match-lineup-team{border:1px solid #2a3a50;border-radius:12px;overflow:hidden}
.match-lineup-title{padding:12px;background:#182638;font-weight:700}
.match-player-list{margin:0;padding:10px 14px;list-style:none}
.match-player-list li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #243247;font-size:16px}
.match-player-list li:last-child{border:0}
.match-rating{color:#86dca4;font-weight:700}

/* Campo de alineación */
.lineup-pitch-wrap{width:100%;max-width:760px;margin:0 auto;border:1px solid #355a43;border-radius:20px;overflow:hidden;background:#17231c}
.lineup-pitch-teambar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:#386b4d;color:#f2f5f2;font:700 clamp(15px,3vw,20px) Arial,sans-serif}
.lineup-team-name{display:flex;align-items:center;gap:10px}
.lineup-team-name img{width:30px;height:30px;object-fit:contain;background:#fff;border-radius:7px;padding:3px}
.lineup-formation{padding:5px 12px;border-radius:20px;background:#155a32;font-size:14px;white-space:nowrap}
.lineup-pitch{position:relative;isolation:isolate;display:flex;flex-direction:column;justify-content:space-around;gap:14px;min-height:600px;padding:24px 10px;overflow:hidden;font-family:Arial,sans-serif;background:repeating-linear-gradient(0deg,#477a58 0,#477a58 80px,#427352 80px,#427352 160px)}
.lineup-pitch:before{content:"";position:absolute;inset:0;border:2px solid #8bb99a;pointer-events:none;z-index:-1}
.pitch-line{position:absolute;top:50%;left:0;right:0;border-top:2px solid #8bb99a}
.pitch-circle{position:absolute;top:50%;left:50%;width:100px;height:100px;border:2px solid #8bb99a;border-radius:50%;transform:translate(-50%,-50%)}
.pitch-box{position:absolute;left:23%;width:54%;height:74px;border:2px solid #8bb99a}
.pitch-box.top{top:0;border-top:0;border-radius:0 0 12px 12px}
.pitch-box.bottom{bottom:0;border-bottom:0;border-radius:12px 12px 0 0}
.pitch-row{position:relative;z-index:1;display:flex;justify-content:space-around;align-items:center;gap:4px}
.pitch-player{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;color:#f7f7f7;text-shadow:0 1px 2px #203a29}
.player-avatar{width:clamp(34px,8vw,54px);height:clamp(34px,8vw,54px);display:grid;place-items:center;border-radius:13px;background:#dce2e8;color:#1f3545;font-weight:800;font-size:clamp(12px,3vw,17px);box-shadow:0 2px 6px #17362288}
.player-badge{margin-top:-5px;padding:1px 7px;border-radius:12px;background:#e9b900;color:#161616;font-weight:800;font-size:12px}
.player-name{margin-top:3px;max-width:100%;font-size:clamp(10px,2.4vw,13px);line-height:1.15;overflow-wrap:anywhere}
.lineup-opponent{border-top:1px solid #2a4b35}

/* Videos del partido */
.match-videos-intro h3{margin:0 0 8px;text-align:center;font:600 clamp(19px,3vw,25px) var(--f-head)}
.match-videos-intro p{max-width:680px;margin:0 auto 16px;text-align:center;color:#b7c4d7;font-size:16px}
.match-video-search-links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 18px}
.match-video-search-links a{display:block;padding:12px;text-align:center;border:1px solid #30425d;border-radius:12px;background:#172334;color:#d9e8ff;text-decoration:none;font-size:15px}
.match-video-form{padding:14px;margin-bottom:16px;border:1px solid #293b53;border-radius:12px;background:#0d1420}
.match-video-form label{display:block;margin-bottom:8px;font-weight:700}
.match-video-input-row{display:flex;gap:8px}
.match-video-input-row input{flex:1;min-width:0;padding:12px;border:1px solid #3b4e68;border-radius:9px;background:#080e18;color:#fff;font-size:15px}
.match-video-input-row button{padding:0 16px;border:0;border-radius:9px;background:var(--claret);font-weight:700;cursor:pointer}
.match-video-form small{display:block;margin-top:8px;color:#8ea0b8}
.match-video-player{width:100%;aspect-ratio:16/9;min-height:200px;overflow:hidden;background:#05080e;border:1px solid #2c3c54;border-radius:12px}
.match-video-player iframe{display:block;width:100%;height:100%;border:0}

/* Responsive */
@media(max-width:650px){
 .player-scorers{grid-template-columns:1fr}
 .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:600px){
 .app{padding:8px 14px 26px}
 header{min-height:94px;padding:12px 0 18px}
 .brand{gap:9px}.brand img{width:48px;height:55px}
 .brandname{font-size:22px;letter-spacing:1px}
 .card{padding:19px 16px;margin:16px 0 21px}
 .barca-hero-banner{margin-bottom:14px}
 .goal-scorers{gap:10px}.goal-team ul{font-size:16px}.goal-team li span{font-size:13px}
 .countdown-units{gap:5px}.countdown-label{font-size:8px}
 .video-play{width:58px;height:58px;font-size:24px}
 .videocaption{padding:10px 15px}
 .status{font-size:10px}.status button{width:100%;min-width:0}
 .lineup-pitch{min-height:530px;padding:18px 5px;gap:10px}
 .pitch-circle{width:78px;height:78px}.pitch-box{height:62px}
}
@media(max-width:560px){
 .match-detail-score{gap:6px;padding:14px 8px}
 .match-detail-club{flex-direction:column;font-size:12px;max-width:100px}
 .match-detail-club img{width:34px;height:34px}
 .match-stat-row{grid-template-columns:34px minmax(50px,1fr) minmax(70px,1.1fr) minmax(50px,1fr) 34px;gap:5px}
 .match-stat-label{font-size:12px}.match-stat-value{font-size:14px}
 .match-lineup-grid,.match-video-search-links{grid-template-columns:1fr}
 .match-detail-panel{padding:12px}
 .match-video-input-row{flex-direction:column}.match-video-input-row button{padding:12px}
}
@media(prefers-reduced-motion:reduce){
 html{scroll-behavior:auto}
 *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
