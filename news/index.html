<style>
/* =====================================================================
   MEDIA WATCH GT · sistema visual
   Minimalista: fondo gris muy claro, azul oscuro + morado + grises.
   ===================================================================== */
:root {
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --bg: #f5f6fa;
  --surface: #ffffff;
  --surface-2: #f8f9fc;
  --surface-3: #eef0f6;
  --border: #e5e7ef;
  --border-strong: #d3d7e3;
  --text: #141631;
  --text-2: #464a63;
  --muted: #7a7f98;
  --navy: #1e1b4b;
  --navy-2: #312e81;
  --primary: #4338ca;
  --purple: #7c3aed;
  --accent-soft: #eef0ff;
  --accent-soft-2: #f3edff;
  --ok: #15803d; --ok-bg: #e8f6ed;
  --warn: #b45309; --warn-bg: #fdf3e2;
  --err: #b91c1c; --err-bg: #fdecec;
  --info: #475569; --info-bg: #eef1f5;
  --breaking: #c2185b; --breaking-bg: #fde7f0;
  --chart: #5b50d6;
  --chart-soft: rgba(91, 80, 214, .14);
  --shadow-sm: 0 1px 2px rgba(20, 22, 49, .04), 0 1px 3px rgba(20, 22, 49, .04);
  --shadow: 0 2px 6px rgba(20, 22, 49, .04), 0 8px 24px rgba(20, 22, 49, .05);
  --shadow-lg: 0 12px 40px rgba(20, 22, 49, .12);
  --r: 14px; --r-sm: 10px; --r-xs: 7px;
  --side: 264px;
  --gap: 24px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0d0e1a; --surface: #161829; --surface-2: #1b1d31; --surface-3: #23263d;
  --border: #2a2d46; --border-strong: #3a3e5c;
  --text: #eceefa; --text-2: #b9bdd6; --muted: #8b90ad;
  --navy: #c7c9ff; --navy-2: #a5a8ff; --primary: #8b85ff; --purple: #b794ff;
  --accent-soft: #23234a; --accent-soft-2: #2a2147;
  --ok: #4ade80; --ok-bg: #12301f; --warn: #fbbf24; --warn-bg: #352812; --err: #f87171; --err-bg: #3a1717;
  --info: #b4bccb; --info-bg: #242a36; --breaking: #f472b6; --breaking-bg: #3a1429;
  --chart: #9b93ff; --chart-soft: rgba(155, 147, 255, .18);
  --shadow-sm: none; --shadow: 0 1px 0 rgba(255,255,255,.02); --shadow-lg: 0 12px 40px rgba(0,0,0,.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--primary); }
p a, .muted a, .banner a, .empty a { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; letter-spacing: -.01em; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 100; border-radius: 8px; }
.skip:focus { left: 8px; }
.ic { flex: none; }
.flip { transform: rotate(180deg); }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.row { display: flex; align-items: center; }
.gap { gap: 12px; } .gap-s { gap: 8px; display: inline-flex; align-items: center; }
.wrap { flex-wrap: wrap; } .between { justify-content: space-between; }
.center { display: flex; justify-content: center; margin-top: 18px; }
.push { margin-left: auto; }
.nowrap { white-space: nowrap; }
.accent { color: var(--purple); }
.danger { color: var(--err) !important; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }

#progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: linear-gradient(90deg, var(--primary), var(--purple)); z-index: 60; transition: width .3s ease; }

/* ------------------------------- Sidebar ------------------------------- */
.sidebar { position: fixed; inset: 0 auto 0 0; width: var(--side); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 14px; z-index: 40; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-text b { display: block; font-size: 1.02rem; font-weight: 800; letter-spacing: .02em; color: var(--navy); }
.brand-text em { font-style: normal; color: var(--purple); }
.brand-text small { color: var(--muted); font-size: .74rem; letter-spacing: .02em; }
.nav-group { margin-bottom: 14px; }
.nav-title { display: block; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 12px 6px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: var(--r-sm); color: var(--text-2); font-weight: 500; font-size: .92rem; transition: background .15s, color .15s; position: relative; }
.nav a:hover { background: var(--surface-3); color: var(--text); }
.nav a.on { background: var(--accent-soft); color: var(--navy-2); font-weight: 650; }
.nav a.on::before { content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--purple); }
.nav-badge { margin-left: auto; background: var(--purple); color: #fff; font-size: .7rem; border-radius: 99px; padding: 1px 7px; }
.nav-count { margin-left: auto; color: var(--muted); font-size: .78rem; font-weight: 600; }
.slogan { margin-top: auto; padding: 16px 12px 4px; font-size: .68rem; font-weight: 700; letter-spacing: .09em; line-height: 1.7; color: var(--muted); border-top: 1px solid var(--border); }
.scrim { display: none; }

/* ------------------------------- Shell ------------------------------- */
.shell { margin-left: var(--side); min-height: 100vh; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 12px 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.menu-btn, .mbrand { display: none; }
.mbrand { font-weight: 800; color: var(--navy); letter-spacing: .02em; font-size: .95rem; }
.mbrand em { font-style: normal; color: var(--purple); }
.updated { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.updated b { font-size: .82rem; font-weight: 650; text-transform: capitalize; white-space: nowrap; }
.updated span { font-size: .75rem; color: var(--muted); white-space: nowrap; }
.tsearch { flex: 1 1 260px; min-width: 200px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 0 14px; height: 40px; color: var(--muted); transition: border-color .15s, box-shadow .15s; }
.tsearch:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px var(--accent-soft); }
.tsearch input { flex: 1; border: 0; background: none; outline: none; color: var(--text); min-width: 0; }
.tsearch kbd { font-size: .72rem; border: 1px solid var(--border); border-radius: 5px; padding: 0 6px; color: var(--muted); }
.tcontrols { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.custom-dates { display: inline-flex; gap: 6px; }
.tstatus { display: flex; align-items: center; gap: 6px; }
.status-pill { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 99px; font-size: .78rem; font-weight: 600; background: var(--surface); border: 1px solid var(--border); white-space: nowrap; }
.status-pill i, .pill i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.status-pill.st-ok { color: var(--ok); } .status-pill.st-partial { color: var(--warn); } .status-pill.st-error { color: var(--err); }
.status-pill.st-demo { color: var(--purple); } .status-pill.st-pending { color: var(--muted); }
.status-pill.st-updating { color: var(--primary); } .status-pill.st-updating i { animation: pulse 1s infinite; }
#refreshBtn.spin svg { animation: spin 1s linear infinite; }
#bellBtn { position: relative; }
#bellCount { position: absolute; top: 2px; right: 2px; background: var(--breaking); color: #fff; font-size: .62rem; min-width: 16px; height: 16px; border-radius: 99px; display: grid; place-items: center; padding: 0 4px; }
.notif-panel { position: absolute; right: 24px; top: 60px; width: min(380px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow-lg); z-index: 50; }
.np-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
.notif { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-2); }
.notif.unread { background: var(--accent-soft); }
.notif b { display: block; font-size: .84rem; color: var(--text); }
.notif span { display: block; font-size: .82rem; }
.notif small { color: var(--muted); font-size: .74rem; }
.pad { padding: 16px; }

.view { flex: 1; padding: 26px 28px 40px; max-width: 1480px; width: 100%; margin: 0 auto; outline: none; }
.view.enter { animation: enter .28s ease both; }
.foot { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 18px 28px 28px; color: var(--muted); font-size: .76rem; border-top: 1px solid var(--border); }

/* ------------------------------- Controles ------------------------------- */
.sel { height: 38px; padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: .86rem; min-width: 0; }
textarea.sel { height: auto; padding: 8px 12px; resize: vertical; }
.sel:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--accent-soft); }
.btn, .btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: var(--r-sm); font-weight: 600; font-size: .86rem; transition: background .15s, border-color .15s, transform .1s; white-space: nowrap; }
.btn { background: var(--surface); border: 1px solid var(--border-strong); color: var(--text); }
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn.primary { background: linear-gradient(135deg, var(--navy-2), var(--purple)); color: #fff; border: 0; }
:root[data-theme="dark"] .btn.primary { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn:active, .btn-ghost:active { transform: translateY(1px); }
.btn.big { height: 48px; padding: 0 24px; font-size: .95rem; letter-spacing: .03em; }
.btn-ghost { border: 1px solid var(--border); background: var(--surface); color: var(--text-2); }
.btn-ghost:hover { border-color: var(--border-strong); color: var(--text); background: var(--surface-2); }
.btn-ghost.sm, .btn.sm { height: 32px; padding: 0 11px; font-size: .8rem; gap: 6px; }
.btn-link { color: var(--primary); font-size: .82rem; font-weight: 600; }
.icon-btn { width: 36px; height: 36px; border-radius: var(--r-sm); display: inline-grid; place-items: center; color: var(--text-2); transition: background .15s, color .15s; }
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn.on { color: var(--purple); }
.icon-btn.sm { width: 30px; height: 30px; }
.seg { display: inline-flex; background: var(--surface-3); border-radius: var(--r-sm); padding: 3px; gap: 2px; }
.seg button { height: 30px; padding: 0 12px; border-radius: 7px; font-size: .8rem; font-weight: 600; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface); font-size: .82rem; font-weight: 550; color: var(--text-2); transition: all .15s; white-space: nowrap; }
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip.on { background: var(--navy-2); border-color: var(--navy-2); color: #fff; }
:root[data-theme="dark"] .chip.on { background: var(--primary); border-color: var(--primary); color: #0d0e1a; }
.chip-n { font-size: .7rem; background: var(--surface-3); color: var(--muted); border-radius: 99px; padding: 0 7px; line-height: 18px; font-weight: 700; }
.chip.on .chip-n { background: rgba(255,255,255,.2); color: inherit; }
.chip-n.new { background: var(--purple); color: #fff; }
.switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--border-strong); border-radius: 99px; transition: .2s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: var(--shadow-sm); }
.switch input:checked + span { background: var(--purple); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ------------------------------- Badges ------------------------------- */
.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: .7rem; font-weight: 650; letter-spacing: .01em; background: var(--surface-3); color: var(--text-2); white-space: nowrap; }
.badge.cat { background: var(--accent-soft); color: var(--navy-2); }
.badge.type { background: var(--accent-soft-2); color: var(--purple); }
.badge.cov { background: var(--navy-2); color: #fff; }
:root[data-theme="dark"] .badge.cov { background: var(--primary); color: #0d0e1a; }
.badge.demo { background: var(--warn-bg); color: var(--warn); border: 1px dashed currentColor; }
.badge.fresh-breaking { background: var(--breaking-bg); color: var(--breaking); }
.badge.fresh-now, .badge.fresh-recent { background: var(--ok-bg); color: var(--ok); }
.badge.fresh-today { background: var(--info-bg); color: var(--info); }
.badge.fresh-days, .badge.fresh-old, .badge.fresh-unknown { background: var(--surface-3); color: var(--muted); }
.badge .dot, .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.4s infinite; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 650; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.pill.st-ok { background: var(--ok-bg); color: var(--ok); }
.pill.st-partial { background: var(--warn-bg); color: var(--warn); }
.pill.st-error { background: var(--err-bg); color: var(--err); max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.pill.st-pending, .pill.st-demo { background: var(--surface-3); color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ------------------------------- Logos ------------------------------- */
.logo { --s: 32px; position: relative; width: var(--s); height: var(--s); flex: none; border-radius: calc(var(--s) * .26); background: var(--surface); border: 1px solid var(--border); display: inline-grid; place-items: center; overflow: hidden; }
.logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 12%; background: var(--surface); opacity: 0; transition: opacity .2s; }
.logo img.ok { opacity: 1; }
.logo-fb { font-size: calc(var(--s) * .36); font-weight: 800; color: #fff; background: var(--c, var(--primary)); width: 100%; height: 100%; display: grid; place-items: center; letter-spacing: -.02em; }
.logo-row { display: flex; }
.logo-row .logo { margin-right: -6px; box-shadow: 0 0 0 2px var(--surface); }
.logo-row.big { gap: 10px; margin-bottom: 16px; } .logo-row.big .logo { margin: 0; }

/* ------------------------------- Secciones ------------------------------- */
.page-head { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head > div:nth-child(2) { flex: 1; min-width: 240px; }
.page-head h1 { font-size: 1.6rem; font-weight: 800; color: var(--navy); }
:root[data-theme="dark"] .page-head h1 { color: var(--text); }
.page-head p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; max-width: 760px; }
.ph-ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--navy-2), var(--purple)); box-shadow: 0 6px 16px rgba(76, 29, 149, .25); }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.sec-head h2 { font-size: 1.02rem; font-weight: 800; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; }
.sec-head p { margin: 2px 0 0; color: var(--muted); font-size: .8rem; }
.sec-right { display: flex; gap: 8px; align-items: center; }
.pipe { color: var(--purple); font-weight: 400; }
.h2 { font-size: 1.05rem; font-weight: 800; }
.block { margin-top: 30px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--gap); margin-top: 30px; align-items: start; }
.cols > .block { margin-top: 0; }
.side-col { display: flex; flex-direction: column; gap: var(--gap); }
.cols > .panel.side-col { display: block; }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--r-sm); font-size: .86rem; margin-bottom: 18px; }
.banner.demo { background: var(--warn-bg); color: var(--warn); border: 1px dashed currentColor; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner div { color: var(--text-2); } .banner b { color: var(--text); }

/* ------------------------------- Stats ------------------------------- */
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; display: grid; grid-template-columns: auto 1fr; grid-template-areas: "ic h" "v v" "l l"; gap: 2px 8px; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); color: inherit; }
.stat-ic { grid-area: ic; width: 32px; height: 32px; border-radius: 9px; background: var(--accent-soft); color: var(--navy-2); display: grid; place-items: center; }
.stat-h { grid-area:
